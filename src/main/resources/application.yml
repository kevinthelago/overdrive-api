spring:
  application:
    name: overdrive-api
  datasource:
    url: jdbc:postgresql://localhost:5432/overdrive
    username: overdrive
    password: overdrive
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
